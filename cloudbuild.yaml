# Cloud Build — CI/CD pipeline for building, testing, and deploying to Cloud Run.
#
# Trigger: Push to main branch or manual trigger.
# Usage: gcloud builds submit --config cloudbuild.yaml

steps:
  # ── Step 1: Run tests ──────────────────────────────────────────────────
  - name: "python:3.11-slim"
    id: "run-tests"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install -q pytest fastapi httpx numpy pandas scikit-learn xgboost \
          scipy joblib loguru pydantic python-dotenv
        pytest tests/ -v --tb=short -x

  # ── Step 2: Build Docker image ────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "build-image"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/fakenews-api:$COMMIT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/fakenews-api:latest"
      - "."
    waitFor: ["run-tests"]

  # ── Step 3: Push to Container Registry ────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: "push-image"
    args:
      - "push"
      - "--all-tags"
      - "gcr.io/$PROJECT_ID/fakenews-api"
    waitFor: ["build-image"]

  # ── Step 4: Deploy to Cloud Run ───────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "fakenews-api"
      - "--image"
      - "gcr.io/$PROJECT_ID/fakenews-api:$COMMIT_SHA"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--memory"
      - "1Gi"
      - "--cpu"
      - "2"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "5"
      - "--set-env-vars"
      - "MLFLOW_TRACKING_URI=http://mlflow-server:5000,MODEL_NAME=fakenews_classifier"
      - "--allow-unauthenticated"
    waitFor: ["push-image"]

images:
  - "gcr.io/$PROJECT_ID/fakenews-api:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/fakenews-api:latest"

timeout: "1200s"

options:
  logging: CLOUD_LOGGING_ONLY
